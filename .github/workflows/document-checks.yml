name: Document checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python scripts/check_docs.py
